services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-root_dev_123}
      MYSQL_DATABASE: inventario_db
      MYSQL_USER: ${DOCKER_MYSQL_USER:-inventario_user}
      MYSQL_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-inventario_dev_123}
    ports:
      - "127.0.0.1:${MYSQL_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${DOCKER_MYSQL_USER:-inventario_user}
      MYSQL_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-inventario_dev_123}
      MYSQL_DATABASE: inventario_db
    ports:
      - "127.0.0.1:${APP_EXTERNAL_PORT:-3000}:3000"

volumes:
  mysql_data:
